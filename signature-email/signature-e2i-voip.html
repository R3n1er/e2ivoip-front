<!--
  Signature email E2I VOIP — pour HubSpot (Paramètres > Signatures)
  Nom dynamique : {{ agent.fullName }} (token HubSpot)
  Fonction dynamique : {{ agent.jobTitle }} — reprend le "Titre du poste" du profil HubSpot de l'agent
  Téléphone / email : fixes (ligne assistance commune)
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #000000;">
  <tr>
    <td style="vertical-align: top;">

      <!-- Bloc identité + contact -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <!-- Identité -->
          <td style="vertical-align: middle; padding-right: 15px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-bottom: 4px;">
                  <span style="font-size: 18px; font-weight: 600; color: #000000;">{{ agent.fullName }}</span>
                </td>
              </tr>
              <tr>
                <td style="font-size: 14px; line-height: 22px; color: #000000;">
                  <span>{{ agent.jobTitle }}</span>
                </td>
              </tr>
              <tr>
                <td style="font-size: 14px; line-height: 22px; font-weight: 500; color: #000000;">
                  E2I ASSISTANCE
                </td>
              </tr>
            </table>
          </td>

          <!-- Séparateur vertical -->
          <td style="width: 1px; border-left: 1px solid #f2547d; padding: 0 15px;"></td>

          <!-- Coordonnées -->
          <td style="vertical-align: middle;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr height="25">
                <td style="width: 22px; vertical-align: middle;">
                  <img src="https://cdn2.hubspot.net/hubfs/53/tools/email-signature-generator/icons/phone-icon-2x.png" width="13" alt="Téléphone" style="display: block; background-color: #f2547d; padding: 5px; border-radius: 2px;">
                </td>
                <td style="font-size: 12px; padding-left: 8px;">
                  <a href="tel:+33189560500" style="text-decoration: none; color: #000000;">0189 560 500</a>
                </td>
              </tr>
              <tr height="25">
                <td style="width: 22px; vertical-align: middle;">
                  <img src="https://cdn2.hubspot.net/hubfs/53/tools/email-signature-generator/icons/email-icon-2x.png" width="13" alt="Email" style="display: block; background-color: #f2547d; padding: 5px; border-radius: 2px;">
                </td>
                <td style="font-size: 12px; padding-left: 8px;">
                  <a href="mailto:assistance@e2i-voip.com" style="text-decoration: none; color: #000000;">assistance@e2i-voip.com</a>
                </td>
              </tr>
              <tr height="25">
                <td style="width: 22px; vertical-align: middle;">
                  <img src="https://cdn2.hubspot.net/hubfs/53/tools/email-signature-generator/icons/link-icon-2x.png" width="13" alt="Site web" style="display: block; background-color: #f2547d; padding: 5px; border-radius: 2px;">
                </td>
                <td style="font-size: 12px; padding-left: 8px;">
                  <a href="https://www.e2i-voip.com" style="text-decoration: none; color: #000000;">www.e2i-voip.com</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <!-- Séparateur horizontal -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
        <tr><td style="height: 30px; line-height: 30px; font-size: 0;">&nbsp;</td></tr>
        <tr><td style="border-bottom: 1px solid #f2547d; font-size: 0; line-height: 0;">&nbsp;</td></tr>
        <tr><td style="height: 30px; line-height: 30px; font-size: 0;">&nbsp;</td></tr>
      </table>

      <!-- Logo + CTA -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
        <tr>
          <td style="vertical-align: middle;">
            <img src="https://www.e2i-voip.com/images/Logo-e2ivoip-solo.png" width="200" alt="E2I VOIP" style="display: block; max-width: 200px;">
          </td>
          <td style="text-align: right; vertical-align: middle;">
            <a href="https://www.e2i-voip.com/telephonie-3cx" target="_blank" style="display: inline-block; background-color: #db7070; color: #ffffff; font-weight: 700; font-size: 12px; text-decoration: none; text-align: center; line-height: 40px; padding: 0 12px; border-radius: 3px;">Découvrir 3CX</a>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>
